name: Publish to npm

# Manual only, and gated on an immutable annotated tag whose version matches
# package.json. Publishing is the last step of a release, never a side effect of
# merging. Mirrors the discipline of the Jouzu release workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Annotated Git tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify immutable release tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_REF")" == "tag" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")" == "$GITHUB_SHA" ]]
          node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.RELEASE_REF) process.exit(1)'

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm audit --omit=dev --audit-level=high

      - name: Refuse to overwrite a published version
        env:
          RELEASE_VERSION: ${{ inputs.ref }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if npm view "dsh-llm-shisa@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-llm-shisa@$VERSION is already published" >&2
            exit 1
          fi

      - name: Pack the verified build
        id: pack
        run: echo "tarball=$(npm pack --silent | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Publish the packed tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --registry=https://registry.npmjs.org/ --access=public --provenance --ignore-scripts
